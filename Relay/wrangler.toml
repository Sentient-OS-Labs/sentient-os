# The Double Tap relay: one Worker, one Durable Object class for counters, no storage of request
# content. Secrets (OPENAI_API_KEY) are set with `wrangler secret put`, never written here.
name = "sentient-doubletap-relay"
main = "src/index.ts"
compatibility_date = "2026-09-01"
workers_dev = true

# Structure-only logs (sizes, timings, status codes). Bodies are never logged by the code.
[observability]
enabled = true

[vars]
MODEL = "gpt-5.6-sol"
# Per-user caps (per identity). 0 disables a cap.
HOURLY_CAP = "60"
DAILY_CAP = "100"
# Global monthly ceiling on requests across ALL users: the kill switch against bulk-minted
# identities. 0 = off. At ~9 cents a press, 10000 is roughly $900/month.
GLOBAL_MONTHLY_CAP = "0"
# Payload ceilings. The app sends a ~2000 px JPEG (a few hundred KB as base64) and a ~70 KB vault.
MAX_IMAGE_BASE64_BYTES = "2000000"
MAX_KNOWLEDGE_BASE_BYTES = "700000"

[[durable_objects.bindings]]
name = "COUNTERS"
class_name = "Counter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Counter"]

# Smart Placement: run the Worker near the backend it talks to (OpenAI, US), not only near the user.
[placement]
mode = "smart"
